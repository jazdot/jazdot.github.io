<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazdot | Welcome</title>
    <!-- Importing a clean, futuristic font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Body Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Neon Glows */
        .glow-cyan {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: #00f3ff;
            filter: blur(150px);
            opacity: 0.1;
            top: -20%;
            left: -10%;
            z-index: -1;
            border-radius: 50%;
            animation: float 10s ease-in-out infinite alternate;
        }
        .glow-purple {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: #bc13fe;
            filter: blur(150px);
            opacity: 0.1;
            bottom: -20%;
            right: -10%;
            z-index: -1;
            border-radius: 50%;
            animation: float 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.05); }
        }

        /* Container & Typography */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease-out;
        }

        .greeting {
            font-size: 1.2rem;
            color: #00f3ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .hero-title {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .hero-title span {
            background: linear-gradient(to right, #00f3ff, #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(188, 19, 254, 0.3);
        }

        .hero-subtitle {
            color: #a1a1aa;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Glassmorphism Project Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 500px; /* Kept narrow since there's only one project for now */
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .app-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #00f3ff, #bc13fe);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .app-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .app-card:hover::before {
            opacity: 1;
        }

        .app-badge {
            display: inline-block;
            background: rgba(188, 19, 254, 0.15);
            color: #d876ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(188, 19, 254, 0.3);
        }

        .app-card h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #f4f4f5;
        }

        .app-card p {
            color: #a1a1aa;
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        /* Futuristic Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            background: transparent;
            color: #00f3ff;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid #00f3ff;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .btn:hover {
            background: #00f3ff;
            color: #050505;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .app-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="glow-cyan"></div>
    <div class="glow-purple"></div>

    <div class="container">
        <!-- Welcome Hero Section -->
        <header class="hero-section">
            <p class="greeting">Welcome to the Hub</p>
            <h1 class="hero-title">Hey, I'm <span>Jazdot</span></h1>
            <p class="hero-subtitle">Creator, developer, and the mind behind the tools. Check out my featured project below.</p>
        </header>

        <!-- Projects Grid -->
        <main class="projects-grid">
            
            <!-- Cat Mastermind Card -->
            <article class="app-card">
                <span class="app-badge">FEATURED PROJECT</span>
                <h2>Cat Mastermind</h2>
                <p>The ultimate MBA preparation portal. Master logical reasoning, quantitative aptitude, and verbal ability with precision.</p>
                
                <!-- This links directly to your newly uploaded cat_master folder -->
                <a href="./cat_master/" class="btn">Launch App</a>
            </article>

        </main>
    </div>
</body>
</html>
